<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PS1 Emulator</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #222;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      margin: 15px;
      padding: 10px;
      color: white;
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
    }

    #status {
      margin: 10px;
      color: #ccc;
    }

    #game-container {
      display: none;
      width: 100%;
      max-width: 960px;
      height: 600px;
      margin: 20px auto;
      background: #000;
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h1>PS1 Emulator</h1>

  <input
    id="romInput"
    type="file"
    accept=".chd,.bin,.cue,.img,.mdf,.pbp,.toc,.cbn,.m3u,.ccd"
  />

  <div id="status"></div>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    const romInput = document.getElementById("romInput");
    const status = document.getElementById("status");
    const gameContainer = document.getElementById("game-container");

    romInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) {
        return;
      }

      const extension = file.name.split(".").pop().toLowerCase();

      const allowedFiles = [
        "chd",
        "bin",
        "cue",
        "img",
        "mdf",
        "pbp",
        "toc",
        "cbn",
        "m3u",
        "ccd"
      ];

      if (!allowedFiles.includes(extension)) {
        status.textContent = "Unsupported file type";
        return;
      }

      const romUrl = URL.createObjectURL(file);

      window.EJS_player = "#game";
      window.EJS_core = "psx";
      window.EJS_gameUrl = romUrl;
      window.EJS_biosUrl = "";
      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_volume = 0.8;

      gameContainer.style.display = "block";
      status.textContent = "Loading...";

      const oldScript = document.getElementById("emulatorjs-loader");

      if (oldScript) {
        oldScript.remove();
      }

      const script = document.createElement("script");

      script.id = "emulatorjs-loader";
      script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

      script.onload = function () {
        status.textContent = "";
      };

      script.onerror = function () {
        status.textContent = "Failed to load emulator";
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
